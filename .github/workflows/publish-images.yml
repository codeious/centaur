name: Publish Images

on:
  push:
    branches: [main]
    tags: [v*]
    paths:
      - .github/workflows/publish-images.yml
      - services/**
      - crates/harness-server/**
      - harness/**
      - centaur_sdk/**
      - packages/**
      - tools/**
      - workflows/**
      - scripts/bootstrap-k8s-secrets.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .agents/skills/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
  # PRs keep debug images. Push (main/tags) and workflow_dispatch produce
  # release images so a manual run can publish deployable artifacts.
  RUST_BUILD_PROFILE: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}

jobs:
  # Same-repo heads only. A "is this head a fork?" boolean is true for every
  # PR on a forked repository, so we compare full_name to github.repository.
  # That allows this repository's own PRs and still blocks cross-repository
  # PRs from building or seeing secrets.
  build:
    name: ${{ matrix.service }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-rs
            image: centaur-api-rs
            context: .
            dockerfile: services/api-rs/Dockerfile
            target: ""
            runner: ubicloud-standard-16
          - service: agent
            image: centaur-agent
            context: .
            dockerfile: services/sandbox/Dockerfile
            target: sandbox
            runner: ubicloud-standard-16
          - service: slackbotv2
            image: centaur-slackbotv2
            context: .
            dockerfile: services/slackbotv2/Dockerfile
            target: ""
            runner: ubicloud-standard-4
          - service: iron-proxy
            image: centaur-iron-proxy
            context: .
            dockerfile: services/iron-proxy/Dockerfile
            target: ""
            runner: ubicloud-standard-4
          - service: console
            image: centaur-console
            context: services/console
            dockerfile: services/console/Dockerfile
            target: ""
            runner: ubicloud-standard-4

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=semver,pattern={{raw}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_BUILD_PROFILE=${{ env.RUST_BUILD_PROFILE }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digest"
          if [ -z "${DIGEST}" ]; then
            echo "missing digest from build-push-action" >&2
            exit 1
          fi
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/digest"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digest/digest
          if-no-files-found: error
          retention-days: 1

  droid-smoke:
    name: droid-smoke
    needs: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit-test smoke script
        run: PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-centaur-*
          path: ${{ runner.temp }}/digests
          merge-multiple: false

      - name: Inspect digests are linux/amd64
        env:
          DIGEST_ROOT: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for name in centaur-api-rs centaur-agent centaur-slackbotv2 centaur-iron-proxy centaur-console; do
            digest_file="${DIGEST_ROOT}/digest-${name}/digest"
            if [ ! -f "${digest_file}" ]; then
              echo "missing digest artifact for ${name}" >&2
              exit 1
            fi
            digest="$(tr -d '[:space:]' < "${digest_file}")"
            if [ -z "${digest}" ]; then
              echo "empty digest for ${name}" >&2
              exit 1
            fi
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${name}@${digest}"
            echo "inspecting ${ref}"
            inspect_out="$(docker buildx imagetools inspect "${ref}")"
            printf '%s\n' "${inspect_out}"
            # Single-arch OCI manifests do not print Platform in the default
            # inspect text; read os/architecture from the image config.
            platform="$(docker buildx imagetools inspect --format '{{.Image.OS}}/{{.Image.Architecture}}' "${ref}")"
            printf 'Platform: %s\n' "${platform}"
            if [ "${platform}" != "linux/amd64" ]; then
              echo "expected linux/amd64 for ${name}, got: ${platform}" >&2
              exit 1
            fi
            if [ "${name}" = "centaur-agent" ]; then
              echo "AGENT_REF=${ref}" >> "${GITHUB_ENV}"
            fi
          done

      - name: Pull agent and check droid version
        run: |
          set -euo pipefail
          docker pull "${AGENT_REF}"
          version="$(docker run --rm --entrypoint droid -e FACTORY_DROID_AUTO_UPDATE_ENABLED=false "${AGENT_REF}" --version)"
          printf 'droid --version: %s\n' "${version}"
          case "${version}" in
            *0.227.0*) ;;
            *)
              echo "expected droid 0.227.0, got: ${version}" >&2
              exit 1
              ;;
          esac

      - name: Run Droid PONG smoke
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: python3 scripts/ci/droid_smoke.py --image "${AGENT_REF}"
